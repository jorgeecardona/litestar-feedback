[project]
name = "litestar-feedback"
dynamic = ["version"]  # the single source of truth is __version__ in src/litestar_feedback/__init__.py
description = "Litestar plugins for a customer support inbox and rrweb session replay, in your own database"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jorge Cardona", email = "jorgeecardona@gmail.com" }]
keywords = ["litestar", "customer-support", "issues", "session-replay", "rrweb", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Framework :: Pytest",
    "Typing :: Typed",
]
dependencies = [
    "litestar>=2.23",
    "sqlalchemy[asyncio]>=2.0.30",
]

[project.optional-dependencies]
# Replay needs nothing beyond the base install today. The extra exists so a host can say
# `litestar-feedback[replay]` and keep working if replay later gains a dependency.
replay = []

[project.urls]
Homepage = "https://gitlab.com/cardona-oss/litestar-feedback"
Repository = "https://gitlab.com/cardona-oss/litestar-feedback"
Changelog = "https://gitlab.com/cardona-oss/litestar-feedback/-/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
# Registers the five fixture stubs the support contract test needs. A repo overrides them.
litestar_feedback_support = "litestar_feedback.support.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/litestar_feedback/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/litestar_feedback"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.uv]
# After the pre-commit hook bumps __version__, uv must rebuild the editable install.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/litestar_feedback/__init__.py" }]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright[nodejs]>=1.1.390",
    "pytest>=8",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "alembic>=1.13",
    "prodc>=0.11.4,<0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning", "error::litestar.exceptions.LitestarWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["litestar_feedback", "examples"]

[tool.pyright]
include = ["src", "tests", "examples"]
extraPaths = ["src", "."]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
